services:
  - type: web
    name: lumina-studio
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r lumina/requirements.txt
      flask --app lumina.wsgi db upgrade
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: FRONTEND_VARIANT
        value: "cinematic"
      - key: ADMIN_LOGIN_VARIANT
        value: "signal"
