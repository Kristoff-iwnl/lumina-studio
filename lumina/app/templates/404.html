{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}

<section class="container" style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 100px 20px;">
    <div>
        <h1 style="font-size: 5rem; margin-bottom: 0.5rem;">404</h1>
        <h2 style="font-size: 2rem; margin-bottom: 1.5rem;">Page Not Found</h2>
        <p style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 2rem;">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('public.index') }}" class="cta-button">← Back to Home</a>
    </div>
</section>

{% endblock %}
